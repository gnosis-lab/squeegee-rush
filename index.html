<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07010a">
  <!-- squeegee-rush v5 -->
  <title>SQUEEGEE RUSH — Ami Merchant Studios</title>
  <style>
:root { --pad: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: #07010a; color: #fff;
  font-family: PressStart, ui-monospace, monospace;
  overflow: hidden; touch-action: none; user-select: none;
  -webkit-user-select: none;
}
#wrap {
  display: flex; flex-direction: column;
  width: 100%; height: 100%; height: 100dvh;
}
#game {
  flex: 1 1 auto; width: 100%; min-height: 0;
  display: block; background: #07010a;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
#pad {
  flex: 0 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  gap: 16px;
  padding: 10px 14px calc(10px + var(--pad));
  background: linear-gradient(180deg, rgba(10,2,14,0.2), rgba(10,2,14,0.92));
}
.cluster { display: flex; gap: 12px; }
.btn {
  width: 76px; height: 76px;
  border-radius: 16px;
  border: 3px solid #f4e8ff;
  background: rgba(22, 8, 28, 0.82);
  color: #fff;
  font-family: PressStart, monospace;
  font-size: 11px;
  letter-spacing: 0.5px;
  touch-action: none;
  cursor: pointer;
}
.btn.held, .btn:active { background: #ff2fa0; border-color: #fff; transform: translateY(1px); }
.btn.swipe { border-color: #7dff6a; color: #7dff6a; }
.btn.swipe.held, .btn.swipe:active { background: #1f8a38; color: #fff; border-color: #fff; }
.btn.jump { border-color: #ffe14a; color: #ffe14a; }
.btn.jump.held, .btn.jump:active { background: #c9a116; color: #111; }
@media (orientation: landscape) {
  #pad {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: transparent;
    pointer-events: none;
    z-index: 5;
    padding-bottom: calc(8px + var(--pad));
  }
  #pad .btn { pointer-events: auto; width: 64px; height: 64px; font-size: 10px; }
  #wrap { height: 100dvh; }
  #game { flex: 1; height: 100dvh; }
}
@media (max-width: 420px) and (orientation: portrait) {
  .btn { width: 68px; height: 68px; font-size: 10px; }
}

#codeBar {
  display: none;
  flex: 0 0 auto;
  position: relative;
  left: auto;
  bottom: auto;
  transform: none;
  z-index: 8;
  gap: 8px;
  align-items: center;
  background: rgba(10, 8, 18, 0.94);
  border-top: 2px solid #ffe14a;
  border-bottom: 0;
  border-left: 0;
  border-right: 0;
  border-radius: 0;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  width: 100%;
  max-width: none;
  box-sizing: border-box;
}
#codeInput {
  flex: 1 1 auto;
  min-width: 0;
  background: #0e0a16;
  border: 1px solid #ffe14a;
  color: #fff;
  font-family: PressStart, ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.5px;
  padding: 10px 10px;
  border-radius: 6px;
}
#codeGo {
  flex: 0 0 auto;
  background: #ffe14a;
  color: #111;
  border: 0;
  border-radius: 6px;
  font-family: PressStart, ui-monospace, monospace;
  font-size: 10px;
  padding: 10px 12px;
  cursor: pointer;
}
#codeGo:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="800" height="450" aria-label="Squeegee Rush game"></canvas>
    <div id="pad">
      <div class="cluster">
        <button class="btn" id="btnL" type="button" aria-label="Left">LEFT</button>
        <button class="btn" id="btnR" type="button" aria-label="Right">RIGHT</button>
      </div>
      <div class="cluster">
        <button class="btn jump" id="btnJ" type="button" aria-label="Jump">JUMP</button>
        <button class="btn swipe" id="btnS" type="button" aria-label="Swipe">SWIPE</button>
      </div>
    </div>
    <div id="codeBar">
      <input id="codeInput" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ENTER CODE" aria-label="Enter pack code">
      <button id="codeGo" type="button">REDEEM</button>
    </div>
  </div>

  function update(dt) {
    if (dt > 0.05) dt = 0.05;
    Chip.tick();

    if (flash > 0) flash = Math.max(0, flash - dt);
    if (dailyToast > 0) dailyToast -= dt;
    if (shopMsgT > 0) shopMsgT -= dt;

    if (state.mode === "title" || state.mode === "shop" || state.mode === "locker") {
      state.titleT += dt;

        tryIt.t += dt;
        if (tryIt.t > 2.8) tryIt.on = false;
      }
      for (let i = tryFx.length - 1; i >= 0; i--) {
        const p = tryFx[i];

        if (p.life <= 0) tryFx.splice(i, 1);

    }

    if (state.mode === "intro") {
      introT -= dt;
      player.animT += dt;
      if (introT <= 0) state.mode = "play";

    if (state.mode === "victory") {

    state.time -= dt;

    if (state.comboT > 0) {
      state.comboT -= dt;
      if (state.comboT <= 0) { state.comboT = 0; state.combo = 1; }
    }
    if (player.stunT > 0) player.stunT -= dt;
    if (player.invulnT > 0) player.invulnT -= dt;
    if (pressed.jump) player.jumpBuf = JUMP_BUF;

      if (input.right) move += 1;

    if (move !== 0) player.facing = move;

      const s = Math.sign(player.vx);
      player.vx -= s * FRICTION * dt;
      if (Math.sign(player.vx) !== s) player.vx = 0;
    }
    const cap = player.swiping ? MAX_SPEED * 0.55 : MAX_SPEED;
    if (player.vx > cap) player.vx = cap;
    if (player.vx < -cap) player.vx = -cap;

    if (player.grounded) player.coyote = COYOTE;
    else player.coyote = Math.max(0, player.coyote - dt);
    if (player.jumpBuf > 0 && player.coyote > 0 && !blocked) {
      player.vy = JUMP_V; player.grounded = false; player.coyote = 0; player.jumpBuf = 0;
      Chip.sfx("jump");
      burst(player.x, player.y, 6, ["#ffffff", "#c8f4ff"], 80);
    }
    player.vy += GRAVITY * dt;
    if (player.vy > 980) player.vy = 980;
    player.x += player.vx * dt;
    const prevY = player.y;
    player.y += player.vy * dt;
    if (player.x < 40) { player.x = 40; player.vx = 0; }

    player.grounded = false;
    if (L.solid && player.y >= GROUND && player.vy >= 0) {
      player.y = GROUND; player.vy = 0; player.grounded = true;
    }
    for (let i = 0; i < platforms.length; i++) {
      const p = platforms[i];
      if (player.x > p.x - 12 && player.x < p.x + p.w + 12) {
        if (player.vy >= 0 && prevY <= p.y + 6 && player.y >= p.y) {

    }
    if (player.grounded) { lastSafeX = player.x; lastSafeY = player.y; }
    if (!L.solid && player.y > VIEW_H + 70) {
      hurt();
      player.x = lastSafeX; player.y = lastSafeY; player.vx = 0; player.vy = 0; player.grounded = true;
    }

    if (pressed.swipe && !blocked && !player.swiping) {
      player.swiping = true; player.swipeT = 0; Chip.sfx("swipe"); tryPaint();
    }
    if (player.swiping) {
      player.swipeT += dt;
      if (player.swipeT >= SWIPE_TIME) { player.swiping = false; player.swipeT = 0; }
    }
    player.animT += dt * (player.grounded && Math.abs(player.vx) > 25 ? (0.8 + Math.abs(player.vx) / MAX_SPEED) : 1);

    const look = player.facing > 0 ? 0.35 : 0.62;
    camX += (player.x - viewW * look - camX) * Math.min(1, 7.5 * dt);
    if (camX < 0) camX = 0;
    ensureWorld(camX + viewW + 700);

    for (let i = 0; i < easels.length; i++) {
      if (easels[i].painted && easels[i].paintT < 1) easels[i].paintT = Math.min(1, easels[i].paintT + dt * 2.8);
    }

    spawnCanT -= dt;
    const elapsed = L.time - state.time;
    const canRate = Math.max(0.7, L.can - elapsed * 0.018);
    if (spawnCanT <= 0) {
      spawnCanT = canRate * (0.7 + Math.random() * 0.55);
      cans.push({ x: camX + 70 + Math.random() * (viewW - 140), y: -34, vy: 30 + Math.random() * 40, color: RAINBOW[Math.random() * RAINBOW.length | 0], rot: Math.random() * 4, dead: false });
    }
    spawnBubT -= dt;
    const bubRate = Math.max(2.6, L.bub - elapsed * 0.03);
    if (spawnBubT <= 0) {
      spawnBubT = bubRate * (0.75 + Math.random() * 0.5);
      const fromRight = Math.random() < 0.5;
      bubbles.push({ x: fromRight ? camX + viewW + 40 : camX - 40, y: GROUND - 150 - Math.random() * 50, vx: (fromRight ? -1 : 1) * (95 + Math.random() * 50), text: BUBBLE_LINES[Math.random() * BUBBLE_LINES.length | 0], bob: Math.random() * 6 });
    }

    for (let i = cans.length - 1; i >= 0; i--) {
      const c = cans[i];
      c.vy += 520 * dt; c.y += c.vy * dt; c.rot += dt * 3;
      if (!c.dead && Math.abs(c.x - player.x) < 30 && c.y > player.y - 100 && c.y < player.y + 8) {
        c.dead = true; hurt(); burst(c.x, c.y, 16, [c.color, "#fff"], 200);
      }
      const floorY = L.solid ? GROUND - 8 : VIEW_H + 40;
      if (c.y > floorY) { if (L.solid) burst(c.x, GROUND - 4, 10, [c.color], 140); cans.splice(i, 1); }
      else if (c.x < camX - 80 || c.x > camX + viewW + 80) cans.splice(i, 1);
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.x += b.vx * dt; b.bob += dt * 4;
      const bw = 18 + b.text.length * 10;
      if (Math.abs(b.x - player.x) < bw * 0.45 && Math.abs((b.y - Math.sin(b.bob) * 6) - (player.y - 60)) < 36) {
        hurt(); burst(b.x, b.y, 10, ["#fff", "#ffb4d8"], 160); bubbles.splice(i, 1); continue;
      }
      if (b.x < camX - 160 || b.x > camX + viewW + 160) bubbles.splice(i, 1);
    }
    for (let i = 0; i < critics.length; i++) {
      const c = critics[i];
      c.x += c.vx * dt; c.bob += dt * 3;
      if (c.x < c.min || c.x > c.max) c.vx *= -1;
      c.sayT -= dt;
      if (c.sayT < -2.2) { c.sayT = 2.4; c.text = CRITIC_LINES[Math.random() * CRITIC_LINES.length | 0]; }
      if (Math.abs(c.x - player.x) < 30 && Math.abs(c.y - player.y) < 30) hurt();
    }

    updateFx(dt);
    pressed.jump = false; pressed.swipe = false;
  }

  function updateFx(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i]; p.t += dt; p.y -= 28 * dt;
      if (p.t >= p.life) popups.splice(i, 1);
    }
  }

  function frameName() {
    if (state.mode === "victory") {
      const em = (save.equipped && save.equipped.emote) || "wave";
      if (em === "moonwalk" || em === "spin") return "walk" + (Math.floor(state.overT * 9) % 4);
      if (em === "hypedance") return (Math.floor(state.overT * 8) % 2) ? "victory" : "walk" + (Math.floor(state.overT * 10) % 4);
      return "victory";
    }
    if (player.swiping) return "swipe" + Math.min(3, Math.floor((player.swipeT / SWIPE_TIME) * 4));
    if (!player.grounded) return "jump";
    if (Math.abs(player.vx) > 22) return "walk" + (Math.floor(player.animT * 9) % 4);
    return "idle";
  }

  function drawLayer(img, y, h, factor, scale) {
    if (!img) return;
    const sc = scale || 1;
    const dw = img.width * sc, dh = img.height * sc;
    const ox = -((camX * factor) % dw);
    for (let x = ox - dw; x < viewW + dw; x += dw) {
      ctx.drawImage(img, 0, 0, img.width, img.height, Math.round(x), y, dw, dh);
    }
  }

  function fillPixelCircle(cx, cy, r, color) {
    ctx.fillStyle = color;
    cx = Math.round(cx); cy = Math.round(cy); r = Math.max(1, Math.round(r));
    for (let y = -r; y <= r; y++) {
      const span = Math.sqrt(r * r - y * y) | 0;
      ctx.fillRect(cx - span, cy + y, span * 2 + 1, 1);
    }
  }

    fillPixelCircle(cx, cy, r + 30, "rgba(255,110,40,0.10)");
    fillPixelCircle(cx, cy, r + 18, "rgba(255,140,50,0.16)");
    fillPixelCircle(cx, cy, r + 8, "rgba(255,170,70,0.28)");
    fillPixelCircle(cx, cy, r, "#ff9430");
    fillPixelCircle(cx, cy, Math.round(r * 0.78), "#ffb347");
    fillPixelCircle(cx, cy, Math.round(r * 0.56), "#ffd166");
    fillPixelCircle(cx, cy, Math.round(r * 0.34), "#ffe994");
    fillPixelCircle(cx, cy, Math.round(r * 0.16), "#fff6d0");
  }

  function drawEasel(e) {
    const sx = e.x - camX, base = e.y;
    ctx.save();
    ctx.translate(sx, base);
    ctx.strokeStyle = "#3a2412"; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(0, -e.h - 10); ctx.lineTo(22, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-16, -22); ctx.lineTo(16, -22); ctx.stroke();
    ctx.fillStyle = "#f4efe4";
    ctx.fillRect(-e.w / 2, -e.h - 8, e.w, e.h);
    ctx.strokeStyle = "#2a1a10"; ctx.lineWidth = 4;
    ctx.strokeRect(-e.w / 2, -e.h - 8, e.w, e.h);
    if (e.painted) {
      const cols = trailColors();
      const n = 6 + Math.floor(e.paintT * 10);
      for (let i = 0; i < n; i++) {
        ctx.fillStyle = cols[(i + (e.seed | 0)) % cols.length];
        const px = -e.w / 2 + 6 + ((i * 17 + e.seed) % (e.w - 14));
        const py = -e.h - 2 + ((i * 13 + e.seed * 2) % (e.h - 12));
        ctx.fillRect(px, py, 8 + (i % 3) * 3, 6 + (i % 4) * 2);
      }
    } else if (easelInRange(e) && state.mode === "play") {
      ctx.strokeStyle = "#ffe14a"; ctx.lineWidth = 2;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(-e.w / 2 - 4, -e.h - 12, e.w + 8, e.h + 8);
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

    ctx.fillStyle = "#d8dce0"; ctx.fillRect(-11, -16, 22, 30);

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function startTryIt() {
    tryIt.on = true;
    tryIt.t = 0;
    tryIt._lastSpawn = -1;
    const cat = catalogFor(shopTab);
    const row = cat[shopIndex];
    tryIt.kind = row ? row.type : "";
    tryFx.length = 0;
    Chip.sfx("swipe");

  function tryItFrame() {
    if (!tryIt.on) return "idle";
    if (tryIt.kind === "emotes") {
      const em = (previewLook(shopTab, shopIndex).emote) || "wave";
      if (em === "moonwalk" || em === "spin") return "walk" + (Math.floor(tryIt.t * 9) % 4);
      if (em === "hypedance") return (Math.floor(tryIt.t * 8) % 2) ? "victory" : "walk" + (Math.floor(tryIt.t * 10) % 4);
      return "victory";
    }
    const cycle = tryIt.t % 1.25;
    if (cycle < SWIPE_TIME) return "swipe" + Math.min(3, Math.floor((cycle / SWIPE_TIME) * 4));
    if (cycle < 0.85) return "idle";
    return "walk" + (Math.floor((cycle - 0.85) * 10) % 4);
  }

  function pulseTryFx(cx, cy, look) {
    const cols = trailColorsFor(look.trail);
    const n = (look.trail === "lightning" || look.trail === "hype") ? 8 : 5;
    for (let i = 0; i < n; i++) {
      tryFx.push({
        x: cx + 24 + Math.random() * 46,
        y: cy - 74 + Math.random() * 28,
        vx: 50 + Math.random() * 90,
        vy: -50 + Math.random() * 36,
        life: 0.35 + Math.random() * 0.3,
        max: 0.65,
        color: cols[i % cols.length],
        size: 2 + (Math.random() * 3 | 0),
        glyph: look.trail === "hype" && i % 3 === 0 ? "W" : null
      });
    }
  }

  function chipRow(label, list, type, y) {
    pixelText(label, 16, y, 7, "#ff8ad4", "left");

    const gap = 6;
    const bw = Math.floor((viewW - 32 - gap * (cols - 1)) / cols);
    const bh = 22;
    let x = 16, yy = y + 10, col = 0;
    for (let i = 0; i < list.length; i++) {
      const it = list[i];
      const have = owns(type, it.id);
      const eq = isEquipped(type, it.id);
      ctx.fillStyle = eq ? "#ffe14a" : have ? "#1a1224" : "#0e0a14";
      roundRect(x, yy, bw, bh, 6); ctx.fill();
      ctx.strokeStyle = have ? "#ffe14a" : "#444"; ctx.lineWidth = 1; ctx.stroke();
      const short = (it.short || it.name.split(" ")[0]).toUpperCase().slice(0, 8);
      pixelText(short, x + bw / 2, yy + bh / 2 + 1, 6, eq ? "#111" : have ? "#fff" : "#666");
      ui["lk_" + type + "_" + it.id] = { x: x, y: yy, w: bw, h: bh, type: type, id: it.id, have: have };
      col++;
      if (col >= cols) { col = 0; x = 16; yy += bh + 6; }
      else x += bw + gap;
    }
    if (col === 0) return yy + 8;
    return yy + bh + 14;

    function layoutBox() {
    const scale = Math.min(W / viewW, H / VIEW_H);
    const dw = viewW * scale, dh = VIEW_H * scale;
    const dx = (W - dw) / 2;
    const extraY = H - dh;
    const dy = H > W * 1.15 ? extraY : extraY / 2;
    return { scale: scale, dx: dx, dy: dy, dw: dw, dh: dh };
  }

  function draw() {
    const ox = (Math.random() * 2 - 1) * shake;
    const oy = (Math.random() * 2 - 1) * shake;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    const box = layoutBox();
    const scale = box.scale, dx = box.dx, dy = box.dy, dw = box.dw, dh = box.dh;
    const lc = letterPair();
    ctx.fillStyle = lc.top;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = lc.bot;
    ctx.fillRect(0, dy + dh, W, Math.max(0, H - (dy + dh)));
    ctx.beginPath(); ctx.rect(dx, dy, dw, dh); ctx.clip();
    ctx.translate(dx + ox * scale, dy + oy * scale);
    ctx.scale(scale, scale);
    ui = {};

    drawBg();
    drawPlatforms();
    for (let i = 0; i < easels.length; i++) drawEasel(easels[i]);
    for (let i = 0; i < cans.length; i++) drawCan(cans[i]);
    for (let i = 0; i < bubbles.length; i++) drawBubble(bubbles[i]);
    for (let i = 0; i < critics.length; i++) drawCritic(critics[i]);

    if (state.mode === "play" || state.mode === "intro" || state.mode === "victory") {
      const blink = player.invulnT > 0 && Math.floor(player.invulnT * 16) % 2 === 0;
      const look = equippedLook();
      const sheet = getLookAtlas(look) || atlas;
      let face = player.facing;
      let px = player.x - camX;
      let py = player.y;
      if (state.mode === "victory") {
        const em = look.emote || "wave";
        if (em === "spin") face = (Math.floor(state.overT * 8) % 2) ? 1 : -1;
        if (em === "moonwalk") { face = -1; px += Math.sin(state.overT * 5) * 18; }
        if (em === "hypedance") {
          face = (Math.floor(state.overT * 6) % 2) ? 1 : -1;
          px += Math.sin(state.overT * 10) * 8;
          py += -Math.abs(Math.sin(state.overT * 12)) * 16;
        }
      }
      drawActor(sheet, frameName(), px, py, face, blink, look);
    }
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      if (p.glyph === "W") drawGlyphW(p.x - camX, p.y, p.color, p.size);
      else { ctx.fillStyle = p.color; ctx.fillRect(p.x - camX, p.y, p.size, p.size); }
      ctx.globalAlpha = 1;
    }
    for (let i = 0; i < popups.length; i++) {
      const p = popups[i];
      ctx.globalAlpha = 1 - p.t / p.life;
      pixelText(p.text, p.x - camX, p.y, 10, p.color);
      ctx.globalAlpha = 1;
    }

    if (state.mode === "play" || state.mode === "intro") drawHud();
    if (state.mode === "title") drawTitle();
    if (state.mode === "intro") drawIntro();
    if (state.mode === "victory") drawVictory();
    if (state.mode === "shop") drawShop();
    if (state.mode === "locker") drawLocker();

    if (flash > 0) { ctx.fillStyle = "rgba(255,40,70," + (flash * 0.35) + ")"; ctx.fillRect(-20, -20, viewW + 40, VIEW_H + 40); }
    ctx.restore();
  }

  function letterColor() {
    if (state.mode === "shop" || state.mode === "locker") return "#07010a";
    if (currentLevel === 2) return "#3e1c62";
    if (currentLevel === 3) return "#12081c";
    return "#2eb0ee";
  }

  function letterPair() {
    if (state.mode === "shop" || state.mode === "locker") return { top: "#07010a", bot: "#07010a" };
    if (currentLevel === 2) return { top: "#3e1c62", bot: "#ff9c48" };
    if (currentLevel === 3) return { top: "#12081c", bot: "#12081c" };
    return { top: "#2eb0ee", bot: "#2eb0ee" };
  }

  function isEquipped(type, id) {
    const key = EQUIP_KEY[type];
    return !!(key && save.equipped[key] === id);
  }

  function equip(type, id) {
    const key = EQUIP_KEY[type];
    if (key) save.equipped[key] = id;
    writeSave();
    Chip.sfx("ui");
  }

  function setMode(m) {
    state.mode = m;
    syncChrome();

  function syncChrome() {
    const pad = document.getElementById("pad");
    const bar = document.getElementById("codeBar");
    const playing = state.mode === "play" || state.mode === "intro";
    if (pad) pad.style.display = (hideChromeFlag || !playing) ? "none" : "";
    if (bar) bar.style.display = (!hideChromeFlag && state.mode === "shop") ? "flex" : "none";
    if (state.mode !== "shop") {
      const inp = document.getElementById("codeInput");
      if (inp && document.activeElement === inp) inp.blur();
    }
  }

    if (!save.packs.founder) {
      save.packs.founder = true;
      save.packs.painter = true;
      save.packs.hype = true;
      save.founderBadge = true;
      save.coins += 5000;

      save.packs.founder = true;
      save.packs.painter = true;
      save.packs.hype = true;
      save.founderBadge = true;

    save.equipped.painter = "golden";

    if (!save.packs.hype && !save.packs.founder) {
      save.packs.hype = true;
      save.coins += 1500;
      save.equipped.shades = "hype";
      save.equipped.trail = "hype";
      save.equipped.emote = "hypedance";
    } else {
      save.packs.hype = true;
    }
    writeSave();
  }

  function redeemCode(raw) {
    const h = digest(raw || "");
    if (h === HASH_FOUNDER) {
      const already = save.packs.founder;
      grantFounder();
      shopMsg = already ? "FOUNDER PACK ALREADY UNLOCKED" : "FOUNDER PACK UNLOCKED";
      shopMsgOk = true;
      Chip.sfx("win");
    } else if (h === HASH_HYPE) {
      const already = save.packs.hype || save.packs.founder;
      grantHype();
      shopMsg = already ? "HYPE PACK ALREADY UNLOCKED" : "HYPE PACK UNLOCKED";
      shopMsgOk = true;
      Chip.sfx("combo");
    } else if (h === HASH_PAINTER) {
      const already = save.packs.painter || save.packs.founder;
      grantPainter();
      shopMsg = already ? "PAINTER PACK ALREADY UNLOCKED" : "PAINTER PACK UNLOCKED";
      shopMsgOk = true;
      Chip.sfx("combo");
    } else {
      shopMsg = "CODE NOT RECOGNIZED";
      shopMsgOk = false;
      Chip.sfx("hit");
    }
    shopMsgT = 3.2;
  }

  function buyOrEquip(type, id) {
    const item = findItem(type, id);
    if (!item) return;
    if (owns(type, id)) {
      if (!isEquipped(type, id)) equip(type, id);
      return;
    }
    if (item.price > 0) {
      if (save.coins >= item.price) {
        save.coins -= item.price;
        if (!save.owned[type]) save.owned[type] = [];
        if (save.owned[type].indexOf(id) < 0) save.owned[type].push(id);
        writeSave();
        equip(type, id);
        shopMsg = "BOUGHT " + item.name;
        shopMsgOk = true;
        shopMsgT = 2.4;
        Chip.sfx("coin");
      } else {
        shopMsg = "NEED " + item.price + " COINS";
        shopMsgOk = false;
        shopMsgT = 2.4;
        Chip.sfx("hit");
      }
      return;
    }
    if (item.pack === "founder") openLink(PACK_FOUNDER);
    else if (item.pack === "hype") openLink(PACK_HYPE);
    else if (item.pack === "painter") openLink(PACK_PAINTER);
  }

  function viewPos(e) {
    const r = canvas.getBoundingClientRect();
    const cx = (e.clientX - r.left) * (canvas.width / Math.max(1, r.width));
    const cy = (e.clientY - r.top) * (canvas.height / Math.max(1, r.height));
    const box = layoutBox();
    return { x: (cx - box.dx) / box.scale, y: (cy - box.dy) / box.scale };
  }

  function handleTitle(p) {
    if (ui.play && hitBtn(ui.play, p.x, p.y)) { startLevel(selectedLevel); return; }
    if (ui.shop && hitBtn(ui.shop, p.x, p.y)) { Chip.init(); Chip.sfx("ui"); setMode("shop"); return; }
    if (ui.locker && hitBtn(ui.locker, p.x, p.y)) { Chip.init(); Chip.sfx("ui"); setMode("locker"); return; }
    if (ui.art && hitBtn(ui.art, p.x, p.y)) { openLink(ART_LINK); return; }
    for (let i = 1; i <= 3; i++) {
      const b = ui["lv" + i];
      if (b && hitBtn(b, p.x, p.y) && !b.locked) {
        selectedLevel = i;
        currentLevel = i;
        Chip.sfx("ui");
      }
    }
  }

  function handleShop(p) {
    if (ui.buyF && hitBtn(ui.buyF, p.x, p.y) && !save.packs.founder) openLink(PACK_FOUNDER);
    if (ui.buyH && hitBtn(ui.buyH, p.x, p.y) && !save.packs.hype && !save.packs.founder) openLink(PACK_HYPE);
    if (ui.buyP && hitBtn(ui.buyP, p.x, p.y) && !save.packs.painter && !save.packs.founder) openLink(PACK_PAINTER);
    if (ui.tabfits && hitBtn(ui.tabfits, p.x, p.y)) { shopTab = "fits"; shopIndex = 0; tryIt.on = false; Chip.sfx("ui"); }
    if (ui.tabfaces && hitBtn(ui.tabfaces, p.x, p.y)) { shopTab = "faces"; shopIndex = 0; tryIt.on = false; Chip.sfx("ui"); }
    if (ui.tabgear && hitBtn(ui.tabgear, p.x, p.y)) { shopTab = "gear"; shopIndex = 0; tryIt.on = false; Chip.sfx("ui"); }
    if (ui.tabdrip && hitBtn(ui.tabdrip, p.x, p.y)) { shopTab = "drip"; shopIndex = 0; tryIt.on = false; Chip.sfx("ui"); }
    const cat = catalogFor(shopTab);
    if (ui.prev && hitBtn(ui.prev, p.x, p.y) && cat.length) {
      shopIndex = (shopIndex - 1 + cat.length) % cat.length;
      tryIt.on = false;
      Chip.sfx("ui");
    }
    if (ui.nextI && hitBtn(ui.nextI, p.x, p.y) && cat.length) {
      shopIndex = (shopIndex + 1) % cat.length;
      tryIt.on = false;
      Chip.sfx("ui");
    }
    if (ui.tryIt && hitBtn(ui.tryIt, p.x, p.y)) startTryIt();
    if (ui.buyItem && hitBtn(ui.buyItem, p.x, p.y) && cat[shopIndex]) {
      buyOrEquip(cat[shopIndex].type, cat[shopIndex].item.id);
    }
    if (ui.back && hitBtn(ui.back, p.x, p.y)) { tryIt.on = false; Chip.sfx("ui"); setMode("title"); }
    if (ui.goLocker && hitBtn(ui.goLocker, p.x, p.y)) { tryIt.on = false; Chip.sfx("ui"); setMode("locker"); }
  }

  function handleLocker(p) {
    if (ui.ltabfits && hitBtn(ui.ltabfits, p.x, p.y)) { lockerTab = "fits"; Chip.sfx("ui"); return; }
    if (ui.ltabfaces && hitBtn(ui.ltabfaces, p.x, p.y)) { lockerTab = "faces"; Chip.sfx("ui"); return; }
    if (ui.ltabgear && hitBtn(ui.ltabgear, p.x, p.y)) { lockerTab = "gear"; Chip.sfx("ui"); return; }
    if (ui.ltabdrip && hitBtn(ui.ltabdrip, p.x, p.y)) { lockerTab = "drip"; Chip.sfx("ui"); return; }
    for (const k in ui) {
      if (k.indexOf("lk_") !== 0) continue;
      const b = ui[k];
      if (!hitBtn(b, p.x, p.y)) continue;
      if (b.have) equip(b.type, b.id);
      else { Chip.sfx("ui"); setMode("shop"); shopTab = lockerTab; shopIndex = 0; }
      return;
    }
    if (ui.back && hitBtn(ui.back, p.x, p.y)) { Chip.sfx("ui"); setMode("title"); }
    if (ui.goShop && hitBtn(ui.goShop, p.x, p.y)) { Chip.sfx("ui"); setMode("shop"); }
  }

  function handleVictory(p) {
    if (ui.packP && hitBtn(ui.packP, p.x, p.y)) openLink(PACK_PAINTER);
    if (ui.packH && hitBtn(ui.packH, p.x, p.y)) openLink(PACK_HYPE);
    if (ui.packF && hitBtn(ui.packF, p.x, p.y)) openLink(PACK_FOUNDER);
    if (ui.retry && hitBtn(ui.retry, p.x, p.y)) { startLevel(currentLevel); return; }
    if (ui.next && hitBtn(ui.next, p.x, p.y)) {
      if (currentLevel < 3 && save.unlocked >= currentLevel + 1) startLevel(currentLevel + 1);
      else setMode("title");
      return;
    }
    if (ui.vshop && hitBtn(ui.vshop, p.x, p.y)) { Chip.sfx("ui"); setMode("shop"); }
  }

  function render() {
    W = canvas.width;
    H = canvas.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (!ready) {
      ctx.fillStyle = letterColor();
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.font = "16px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("LOADING...", W / 2, H / 2);
      return;
    }
    viewW = VIEW_H * (W / Math.max(1, H));
    if (viewW < 360) viewW = 360;
    if (viewW > 980) viewW = 980;
    draw();
  }

  function loop(ts) {
    const t = ts * 0.001;
    const dt = lastT ? t - lastT : 0;
    lastT = t;
    if (ready) update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.floor(r.width * dpr));
    const h = Math.max(1, Math.floor(r.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    W = canvas.width;
    H = canvas.height;
  }

  function bindHold(el, key) {
    if (!el) return;
    const on = function (e) {
      e.preventDefault();
      input[key] = true;
      if (key === "jump") pressed.jump = true;
      if (key === "swipe") pressed.swipe = true;
      el.classList.add("held");
      Chip.init();
    };
    const off = function (e) {
      e.preventDefault();
      input[key] = false;
      el.classList.remove("held");
    };
    el.addEventListener("pointerdown", on);
    el.addEventListener("pointerup", off);
    el.addEventListener("pointerleave", off);
    el.addEventListener("pointercancel", off);
  }

  bindHold(document.getElementById("btnL"), "left");
  bindHold(document.getElementById("btnR"), "right");
  bindHold(document.getElementById("btnJ"), "jump");
  bindHold(document.getElementById("btnS"), "swipe");

  const KEY_MAP = {
    ArrowLeft: "left",
    KeyA: "left",
    ArrowRight: "right",
    KeyD: "right",
    ArrowUp: "jump",
    KeyW: "jump",
    Space: "jump",
    KeyJ: "swipe",
    KeyK: "swipe",
    KeyE: "swipe",
    ShiftLeft: "swipe",
    ShiftRight: "swipe"
  };

  window.addEventListener("keydown", function (e) {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {
      if (e.code === "Enter" && state.mode === "shop") {
        e.preventDefault();
        redeemCode(e.target.value);
      }
      return;
    }
    if (e.code === "KeyM") {
      Chip.muted = !Chip.muted;
      if (Chip.music) Chip.music.gain.value = Chip.muted ? 0 : 0.32;
      return;
    }
    if (e.code === "Space" || e.code === "Enter") {
      if (state.mode === "title") {
        e.preventDefault();
        startLevel(selectedLevel);
        return;
      }
      if (state.mode === "victory" && state.overT > 0.6) {
        e.preventDefault();
        if (currentLevel < 3 && save.unlocked >= currentLevel + 1) startLevel(currentLevel + 1);
        else startLevel(currentLevel);
        return;
      }
      if (state.mode === "intro") {
        introT = 0;
        return;
      }
    }
    const k = KEY_MAP[e.code];
    if (!k) return;
    if (e.repeat) { input[k] = true; return; }
    input[k] = true;
    if (k === "jump") pressed.jump = true;
    if (k === "swipe") pressed.swipe = true;
    if (e.code === "Space" || e.code === "ArrowUp") e.preventDefault();
  });
  window.addEventListener("keyup", function (e) {
    const k = KEY_MAP[e.code];
    if (k) input[k] = false;
  });

  canvas.addEventListener("pointerdown", function (e) {
    Chip.init();
    const p = viewPos(e);
    if (state.mode === "title") handleTitle(p);
    else if (state.mode === "shop") handleShop(p);
    else if (state.mode === "locker") handleLocker(p);
    else if (state.mode === "victory") handleVictory(p);
    else if (state.mode === "intro") introT = 0;
  });

  document.addEventListener("touchmove", function (e) {
    if (e.target && (e.target.tagName === "INPUT" || e.target.closest && e.target.closest("#codeBar"))) return;
    e.preventDefault();
  }, { passive: false });

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 180); });

  const codeInput = document.getElementById("codeInput");
  const codeGo = document.getElementById("codeGo");
  if (codeInput) {
    codeInput.addEventListener("input", function () { codeDraft = codeInput.value; });
    codeInput.addEventListener("keydown", function (e) {
      if (e.code === "Enter") { e.preventDefault(); redeemCode(codeInput.value); }
    });
  }
  if (codeGo) {
    codeGo.addEventListener("click", function (e) {
      e.preventDefault();
      redeemCode(codeInput ? codeInput.value : codeDraft);
    });
  }

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      const img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error("img fail")); };
      img.src = src;
    });
  }

  window.__SQUEEGEE = {
    start: function () { startLevel(selectedLevel || 1); },
    startLevel: startLevel,
    getState: function () {
      return {
        mode: state.mode,
        score: state.score,
        combo: state.combo,
        time: state.time,
        painted: state.painted,
        hits: state.hits,
        ready: ready,
        level: currentLevel,
        coins: save.coins,
        unlocked: save.unlocked,
        packs: { painter: save.packs.painter, founder: save.packs.founder, hype: save.packs.hype },
        equipped: Object.assign({}, save.equipped),
        version: GAME_VER,
        founderBadge: save.founderBadge,
        player: { x: player.x, y: player.y },
        easels: easels.slice(0, 8).map(function (e) { return { x: e.x, y: e.y, painted: e.painted }; }),
        cans: cans.map(function (c) { return { x: c.x, y: c.y }; }),
        bubbles: bubbles.map(function (b) { return { x: b.x, y: b.y }; }),
        viewW: viewW,
        camX: camX
      };
    },
    end: finishLevel,
    goToCanvas: function () {
      const e = easels.find(function (c) { return !c.painted; });
      if (!e) return null;
      player.x = e.x - 34;
      player.y = e.y;
      player.vx = 0;
      player.facing = 1;
      camX = Math.max(0, player.x - viewW * 0.38);
      return { x: e.x, y: e.y };
    },
    setInput: function (opts) {
      opts = opts || {};
      if ("left" in opts) input.left = !!opts.left;
      if ("right" in opts) input.right = !!opts.right;
      if ("jump" in opts) input.jump = !!opts.jump;
      if ("swipe" in opts) input.swipe = !!opts.swipe;
      if (opts.jumpPressed) pressed.jump = true;
      if (opts.swipePressed) pressed.swipe = true;
    },
    hideChrome: function () {
      hideChromeFlag = true;
      var pad = document.getElementById("pad");
      if (pad) pad.style.display = "none";
      var bar = document.getElementById("codeBar");
      if (bar) bar.style.display = "none";
      document.body.style.background = "#07010a";
      resize();
    },
    disableAutoHazards: function () {
      spawnCanT = 1e9;
      spawnBubT = 1e9;
    },
    spawnCan: function (x) {
      cans.push({ x: x, y: -30, vy: 30, color: RAINBOW[Math.random() * RAINBOW.length | 0], rot: 0.2, dead: false });
    },
    spawnBubble: function (x, y, vx, text) {
      bubbles.push({ x: x, y: y == null ? GROUND - 150 : y, vx: vx == null ? -140 : vx, text: text || "HEY!!", bob: 0 });
    },
    nearestUnpainted: function () {
      var best = null, bestD = 1e9;
      for (var i = 0; i < easels.length; i++) {
        if (easels[i].painted) continue;
        var d = easels[i].x - player.x;
        if (d > -20 && d < bestD) { bestD = d; best = easels[i]; }
      }
      return best ? { x: best.x, y: best.y, painted: best.painted, dist: bestD } : null;
    },
    skipIntro: function () { introT = 0; if (state.mode === "intro") state.mode = "play"; syncChrome(); },
    openShop: function () { Chip.init(); setMode("shop"); },
    openLocker: function () { Chip.init(); setMode("locker"); },
    openTitle: function () { setMode("title"); },
    redeem: redeemCode,
    setUnlocked: function (n) { save.unlocked = n; writeSave(); },
    setCoins: function (n) { save.coins = n; writeSave(); },
    owns: owns,
    tryPreview: function () { startTryIt(); },
    setShopTab: function (tab, index) { shopTab = tab || shopTab; shopIndex = index || 0; tryIt.on = false; tryFx.length = 0; },
    version: GAME_VER
  };
  window.__SQUEEGEE_VERSION = GAME_VER;

  Promise.resolve()
    .then(function () {
      if (!window.FONT_DATA) return;
      const face = new FontFace("PressStart", "url(" + window.FONT_DATA + ")");
      return face.load().then(function (f) { document.fonts.add(f); });
    })
    .then(function () {
      const layerNames = ["by_sky", "by_trees", "by_fence", "by_ground", "rf_sky", "rf_skyline", "gal_wall", "gal_floor"];
      const jobs = [loadImage(window.ATLAS_DATA || "frames/atlas.png")];
      layerNames.forEach(function (k) {
        const src = (window.LAYER_DATA && window.LAYER_DATA[k]) || ("frames/levels/" + k + ".png");
        jobs.push(loadImage(src).then(function (img) { layers[k] = img; }).catch(function () {}));
      });
      return Promise.all(jobs);
    })
    .then(function (imgsLoaded) {
      atlas = imgsLoaded[0];
      ready = true;
      window.__SQUEEGEE.ready = true;
      resize();
      syncChrome();
    })
    .catch(function (err) {
      console.error(err);
      ready = true;
    });

  resize();
  syncChrome();
  requestAnimationFrame(loop);
})();

  </script>
</body>
</html>
